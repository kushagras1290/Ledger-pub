services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    command: ["alembic", "upgrade", "head"]
    environment:
      LEDGER_DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment:
      LEDGER_DATABASE_URL: postgresql+psycopg://ledger:ledger@db:5432/ledger
      LEDGER_API_KEYS: ${LEDGER_API_KEYS:-dev-key-change-me}
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
